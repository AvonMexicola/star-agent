<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Agent — Meshy props contact sheet</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05080c;color:#cfe3ff;
            font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;height:100%}
  #labels{position:fixed;inset:0;pointer-events:none}
  .lab{position:absolute;padding:3px 6px;background:rgba(4,10,16,.66);
       border:1px solid #1d3346;border-radius:4px;white-space:pre;line-height:1.35}
  .lab b{color:#b6efd1;font-weight:600}
  .lab.clip{color:#b6efd1;border-color:#2f5a48}
  .lab .warn{color:#ffb4a2}
  #hud{position:fixed;top:8px;right:8px;padding:8px 10px;background:rgba(4,10,16,.8);
       border:1px solid #1d3346;border-radius:6px;white-space:pre;pointer-events:none}
  body.clean #hud{display:none}
</style>
</head>
<body>
<canvas id="viewport"></canvas>
<div id="labels"></div>
<div id="hud">booting…</div>
<script type="module" src="/assets/props-viewer.js"></script>
</body>
</html>
