<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Agent — procedural trees bench</title>
<style>
  html,body{margin:0;height:100%;background:#05080c;color:#cfe3ff;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:8px;left:8px;padding:8px 10px;background:rgba(4,10,16,.72);border:1px solid #1d3346;border-radius:6px;white-space:pre;pointer-events:none}
  #bar{position:fixed;bottom:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}
  a{font:inherit;color:#cfe3ff;background:#0d1a26;border:1px solid #24405a;border-radius:4px;padding:5px 9px;text-decoration:none}
  a:hover{background:#16293a}
  body.clean #hud,body.clean #bar{display:none}
</style>
</head>
<body>
<canvas id="viewport"></canvas>
<div id="hud">booting…</div>
<div id="bar">
  <a href="?view=near">near (3 species, eye height)</a>
  <a href="?view=grove">grove (40 trees @ 30 m)</a>
  <a href="?view=lod">LOD transition (250 m)</a>
  <a href="?view=far">impostors (400 m+)</a>
  <a href="?view=aerial">aerial</a>
  <a href="?view=atlas">atlas</a>
  <a href="?view=near&wind=0">wind off</a>
</div>
<script type="module" src="./trees.js"></script>
</body>
</html>
