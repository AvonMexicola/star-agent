<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creature rig review</title><link rel="icon" href="data:,"><style>body{margin:0;background:#1b2328;color:#e4eee9;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;left:20px;top:20px;padding:18px;background:#10191de8;border:1px solid #61766b;border-radius:8px;max-width:320px}h1{font-size:22px;margin:0 0 8px}p{color:#a9c0b4;line-height:1.5}button,select,input{font:inherit;min-height:40px;margin:4px;color:inherit;background:#233831;border:1px solid #758d80;border-radius:4px;padding:6px}input{width:150px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #d7f7c1}small{display:block;color:#99b0a5;margin-top:8px}@media(max-width:600px){aside{left:8px;top:8px;padding:10px;max-width:270px}h1{font-size:18px}}</style></head><body><canvas id="view"></canvas><aside><h1 id="title">Creature rig review</h1><p>Drag to orbit · scroll or pinch to zoom.</p><button id="play">Pause</button><select id="clip" aria-label="Animation"></select><input id="time" type="range" min="0" max="1" step=".001" value="0" aria-label="Animation position"><small id="status">Loading model…</small></aside><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const model=['deer','pyrebear','suloher-dog','aeon-amphibian','aeon-grazer'].includes(new URLSearchParams(location.search).get('model'))?new URLSearchParams(location.search).get('model'):'deer';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#view'),antialias:true,logarithmicDepthBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
const scene=new THREE.Scene();scene.background=new THREE.Color('#263037');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.02,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xe9f1ff,0x4a483c,2));const key=new THREE.DirectionalLight(0xffefd8,3);key.position.set(4,7,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:.1,far:30});key.shadow.bias=-.0002;scene.add(key);const fill=new THREE.DirectionalLight(0xb9d9ff,1);fill.position.set(-4,3,-4);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x616b67,roughness:.94}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const clock=new THREE.Clock();let mixer,asset,action,playing=true,frames=0,error=null,manifest,fitRadius=0;
function fit(){if(!fitRadius)return;const half=Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*Math.min(1,camera.aspect)),distance=fitRadius/Math.sin(half)*1.1,direction=camera.position.clone().sub(controls.target).normalize();camera.position.copy(controls.target).addScaledVector(direction,distance);controls.update();}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fit();}addEventListener('resize',resize);resize();
function select(name){mixer.stopAllAction();action=mixer.clipAction(asset.animations.find(c=>c.name===name));action.reset().play();if(name==='death'){action.setLoop(THREE.LoopOnce,1);action.clampWhenFinished=true;}playing=true;document.querySelector('#play').textContent='Pause';}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';};document.querySelector('#clip').onchange=e=>select(e.target.value);document.querySelector('#time').oninput=e=>{playing=false;document.querySelector('#play').textContent='Play';action.paused=false;action.time=Number(e.target.value)*action.getClip().duration;mixer.update(0);};
try{[asset,manifest]=await Promise.all([new GLTFLoader().loadAsync(`/models/creatures/${model}.glb`),fetch(`/models/creatures/${model}-manifest.json`).then(r=>r.json())]);asset.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;}});scene.add(asset.scene);mixer=new THREE.AnimationMixer(asset.scene);document.querySelector('#clip').innerHTML=asset.animations.map(c=>`<option>${c.name}</option>`).join('');select('walk');mixer.update(0);asset.scene.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(asset.scene,true),size=bounds.getSize(new THREE.Vector3()),height=size.y;controls.target.set(0,height*.48,0);camera.position.set(size.z*1.3+1,height*.8+1,-size.z*1.6-1);fitRadius=bounds.getBoundingSphere(new THREE.Sphere()).radius;fit();document.querySelector('#title').textContent=({'deer':'Deer · repaired walk',pyrebear:'Pyrebear','suloher-dog':'Suloher dog','aeon-amphibian':'Tideback · shore creature','aeon-grazer':'Mallow · friendly grazer'})[model];document.querySelector('#status').textContent='Metre-scale model · neutral studio lighting';}catch(e){error=e.message;document.querySelector('#status').textContent=error;console.error(e);}
function draw(){requestAnimationFrame(draw);const dt=Math.min(clock.getDelta(),.05);if(mixer&&playing){mixer.update(dt);document.querySelector('#time').value=action.time/action.getClip().duration;}controls.update();renderer.render(scene,camera);frames++;}draw();
window.creatureReview={get state(){return{ready:Boolean(asset),model,error,frames,clips:asset?.animations.map(c=>({name:c.name,duration:c.duration})),clip:action?.getClip().name,time:action?.time,triangles:renderer.info.render.triangles,manifest};}};
</script></body></html>
