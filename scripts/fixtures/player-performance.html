<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg"><title>Player fidelity comparison</title><style>body{margin:0}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
const baseline = new URLSearchParams(location.search).has('baseline');
const root = baseline ? '/.performance-baseline/src' : '/src';
const { RemotePlayers } = await import(/* @vite-ignore */ `${root}/multiplayer/remote-players.js`);
const { loadSocketCalibration } = await import(/* @vite-ignore */ `${root}/equipment.js`);
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#18242e');
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .05, 4000);
scene.add(new THREE.HemisphereLight(0xd0eaff, 0x293322, 2));
const sun = new THREE.DirectionalLight(0xffe7cc, 4); sun.position.set(-4, 7, -5);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x34444b, roughness: .82 }));
floor.receiveShadow = true; floor.position.y = -.01; scene.add(floor);
const manager = new RemotePlayers(scene, { sockets: await loadSocketCalibration() });
const origin = new THREE.Vector3(25e9, 0, 0);
const peers = Array.from({ length: 9 }, (_, i) => ({ id: String(i), colorIndex: i,
  position: [25e9 + (i % 3 - 1) * 3, 1.75, Math.floor(i / 3) * 3], orientation: [0, 0, 0, 1],
  bodyOrientation: [0, 0, 0, 1], velocity: [0, 0, 0], mode: 'walk', shipId: 'nomad',
  shipPosition: null, weapon: ['rifle-laser', 'sidearm-pistol', 'mining-laser-tool'][i % 3], health: 100, gearProgress: 1 }));
manager.sync(peers, 'self');
await Promise.all([...manager.peers.values()].map(entry => entry.character.readyPromise));
await Promise.all([...manager.peers.values()].map(entry => entry.equipment.equip(entry.peer.weapon)));
async function settleAssets() {
  await Promise.all(manager.assets.values());
  if ([...manager.peers.values()].some(entry => entry.ship.userData.assetStatus !== 'ready' || entry.character.error)) throw Error('Player asset failed');
}
await settleAssets();
function matrices() {
  const result = [];
  for (const entry of manager.peers.values()) {
    const nodes = [];
    for (const object of [entry.character.object, entry.ship]) object.traverse(node => nodes.push({ name: node.name, matrix: node.matrixWorld.toArray(), morphs: node.morphTargetInfluences?.slice() }));
    result.push(nodes);
  }
  return result;
}
async function capture() {
  renderer.render(scene, camera);
  const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
  const pixels = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
  gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  const hash = await crypto.subtle.digest('SHA-256', pixels);
  return { pixels: Array.from(new Uint8Array(hash), n => n.toString(16).padStart(2, '0')).join(''), matrices: matrices(),
    renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
    resolution: [gl.drawingBufferWidth, gl.drawingBufferHeight], draws: renderer.info.render.calls, triangles: renderer.info.render.triangles };
}
window.playerPerformance = { ready: true, async run(stage) {
  if (stage === 'ships') {
    camera.position.set(0, 230, 380); camera.lookAt(0, 0, 0);
    for (let i = 0; i < peers.length; i++) {
      Object.assign(peers[i], { mode: 'flight', weapon: null, shipId: i % 2 ? 'atlas' : 'nomad',
        position: [25e9 + (i % 3 - 1) * 110, 20, (Math.floor(i / 3) - 1) * 110], shipPosition: null });
    }
    manager.sync(peers.map(peer => ({ ...peer })), 'self'); await settleAssets();
  } else { camera.position.set(0, 3.5, -12); camera.lookAt(0, 1, 3); }
  for (let frame = 0; frame < 90; frame++) {
    if (frame % 4 === 0) {
      for (let i = 0; i < peers.length; i++) {
        peers[i].position[0] += .015;
        peers[i].orientation = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(frame / 40) * .15).toArray();
        peers[i].velocity = [0, 0, i % 3 === 0 ? 3 : i % 3 === 1 ? 1 : 0];
        peers[i].gearProgress = (frame % 80) / 80;
      }
      manager.sync(peers.map(peer => ({ ...peer })), 'self');
    }
    manager.update(1 / 60, origin);
  }
  return capture();
}, dispose() { manager.dispose(); renderer.dispose(); } };
</script></body></html>
