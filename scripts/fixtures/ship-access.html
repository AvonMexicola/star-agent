<!doctype html><html><head><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ship access edge fixture</title></head><body><canvas tabindex="0"></canvas><script type="module">
import '/src/style.css';import {MiningStore} from '/src/mining/store.js';import {ShipInventory} from '/src/ship-inventory.js';import {emptyItems} from '/src/inventory/containers.js';import {createInventoryUI} from '/src/ship-inventory-ui.js';import {GamepadInput} from '/src/gamepad.js';import {createControllerUI} from '/src/controller-ui.js';
