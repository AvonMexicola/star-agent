<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction UI fixture</title></head><body><div id="keyboard-hints">Keyboard controls</div><button id="fleet-button">Fleet</button><dialog id="fixture-storage"><button data-controller-focus data-controller-key="fixture-storage-close">Close storage</button></dialog>
<script type="module">
import '/src/style.css';
import { GamepadInput } from '/src/gamepad.js';
import { createControllerUI } from '/src/controller-ui.js';
import { createBuildUI } from '/src/build/ui.js';
import { MiningStore } from '/src/mining/store.js';
const memory=new Map(),store=new MiningStore({getItem:key=>memory.get(key)??null,setItem:(key,value)=>memory.set(key,value),removeItem:key=>memory.delete(key)});
store.write(store.withItems(store.state,'pack',{...store.container('pack').items,basalt:4}));
window.pad={id:'Construction UI standard controller',index:0,connected:true,mapping:'standard',axes:[0,0,0,0],buttons:Array.from({length:17},()=>({pressed:false,value:0}))};
const gamepad=new GamepadInput(()=>[window.pad]);
const nav={gamepad,keys:new Set(),enabled:true,focused:true,mode:'walk',insideShip:false,body:{id:'aeon'},notify:message=>window.message=message};
const storageDialog=document.getElementById('fixture-storage');nav.openBackpack=()=>{if(!nav.enabled)return false;nav.enabled=false;storageDialog.showModal();};storageDialog.querySelector('button').onclick=()=>storageDialog.close();storageDialog.onclose=()=>{nav.enabled=true;gamepad.suspend();};
const state={active:false,pieceId:'mainframe',pieceCount:0},build={get active(){return state.active;},state,preview:{pieceId:'mainframe',valid:true,reason:'Ready to place',sources:['Backpack']},begin(id){state.active=true;state.pieceId=id;this.preview.pieceId=id;return {ok:true};},select(id){return this.begin(id);},cancel(){state.active=false;},place(){state.pieceCount++;return {ok:true,message:'Placed.'};},rotate(){},cycleSnap(){},adjustHeight(){}};
const ui=createBuildUI({nav,build,store});
const controller=createControllerUI({nav,openBuild:()=>ui.open(),openRecipes:()=>ui.openRecipes(),buildActive:()=>build.active,handleBuild:pad=>ui.handleController(pad)});
window.fixture={nav,build,store,ui};
let last=performance.now();function frame(now){const pad=gamepad.poll({enabled:nav.enabled,focused:nav.focused,ui:Boolean(document.querySelector('dialog[open]'))});controller.update(pad,(now-last)/1000);ui.update();last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
