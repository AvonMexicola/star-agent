<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg"><title>Handheld material inspection</title><style>body{margin:0;background:#101920;color:#b6efd1;font:14px monospace}canvas{display:block}p{position:absolute;top:20px;left:32px;letter-spacing:.12em}</style></head><body><p id="label"></p><canvas></canvas><script type="module">
import * as THREE from 'three';
import {loadItemGLTF} from '../../src/equipment.js';
const params=new URLSearchParams(location.search),item=params.get('item')||'tractor-beam-tool';
document.querySelector('#label').textContent=`${params.has('baseline')?'BEFORE':'AFTER'} / ${item.toUpperCase()} / ISOLATED MATERIAL VIEW`;
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,logarithmicDepthBuffer:true,preserveDrawingBuffer:true});
renderer.setSize(1440,900);renderer.setPixelRatio(1);renderer.setClearColor(0x101920);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1440/900,.01,1000);
scene.add(new THREE.HemisphereLight(0xc7e2ed,0x364243,1.6));
for(const [pos,color,intensity] of [[[1,3,2],0xffeedb,3.2],[[-2,1,-2],0xb6efd1,1.3],[[2,.3,-.5],0x87adcd,.8]]){
 const light=new THREE.DirectionalLight(color,intensity);light.position.set(...pos);scene.add(light);
}
const gltf=await loadItemGLTF(`/models/props/${item}.glb`),model=gltf.scene;scene.add(model);
model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
center.set(item==='sidearm-pistol'?0:item==='rifle-laser'?-.166:-.2,item==='sidearm-pistol'?0:item==='rifle-laser'?.07:.12,0);
const distance=(item==='sidearm-pistol'?.303:item==='rifle-laser'?.774:.813)*1.8;
camera.position.copy(center).add(new THREE.Vector3(-.48,.30,1).normalize().multiplyScalar(distance));camera.lookAt(center);
function render(){renderer.render(scene,camera);}
render();window.toolQA={scene,camera,model,renderer,render,meta(){let textured=0;const textures=new Set();model.traverse(o=>{if(!o.isMesh)return;for(const m of [o.material].flat()){if(m.map)textured++;for(const k of ['map','normalMap','roughnessMap','metalnessMap'])if(m[k])textures.add(m[k]);}});const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');return {calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:textures.size,textured,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()}}}};
window.toolReady=true;
</script></body></html>
