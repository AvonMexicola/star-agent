<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kestrel — Shipworks inspection</title><link rel="icon" href="/favicon.svg"></head>
<body class="kestrel-studio">
  <header class="studio-heading"><a href="/">Star Agent</a><h1>Kestrel</h1><p>Single-seat interceptor</p></header>
  <main>
    <div id="studio-viewport" aria-label="Interactive Kestrel ship model"></div>
    <p id="studio-status" role="status">Loading the fighter…</p>
    <aside class="studio-spec"><p>13.5 m length<br>9 m span<br>9 t dry mass<br><span id="hardpoint-spec"></span></p><span id="asset-stage">Asset inspection</span></aside>
    <section class="studio-controls" aria-label="Ship inspection controls">
      <nav aria-label="Viewpoints"><button data-view="exterior" aria-pressed="true">Exterior</button><button data-view="rear" aria-pressed="false">Engines</button><button data-view="top" aria-pressed="false">Planform</button><button data-view="cockpit" aria-pressed="false">Pilot seat</button><button data-view="boarding" aria-pressed="false">Boarding</button><button data-view="belly" aria-pressed="false">Underside</button></nav>
      <div class="studio-mechanisms"><button id="canopy-toggle" aria-pressed="false">Open canopy</button><button id="gear-toggle" aria-pressed="true">Retract gear</button><button id="ladder-toggle" aria-pressed="false">Deploy ladder</button><label for="throttle">Engine glow <input id="throttle" type="range" min="0" max="1" step="0.01" value="0.15"></label><button id="turntable" aria-pressed="false">Turntable</button></div>
      <p id="mechanism-status" role="status"></p>
      <p class="studio-help">Drag to orbit · Scroll or pinch to zoom · 1–6 views · C canopy · G gear · L ladder<br>Controller: bumpers change view · D-pad selects controls · A activates</p>
    </section>
  </main>
  <script type="module" src="/src/kestrel-studio.js"></script>
</body></html>
