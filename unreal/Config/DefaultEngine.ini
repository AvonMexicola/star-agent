; Star Agent — Unreal Engine 5.8 project settings.
; The Aeon map is created in the editor (File > New Level > Empty Level, saved as
; /Game/StarAgent/Maps/Aeon). AStarAgentGameMode spawns the planet and sun if
; the level does not contain them, so an empty level is enough to fly.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/StarAgent/Maps/Aeon.Aeon
EditorStartupMap=/Game/StarAgent/Maps/Aeon.Aeon
GlobalDefaultGameMode=/Script/StarAgent.StarAgentGameMode

[/Script/Engine.RendererSettings]
; Lumen through hardware ray tracing: runtime terrain patches have no distance
; fields, so software Lumen cannot see them.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.AntiAliasingMethod=4
; Quixel Megaplants are Nanite Assemblies (voxel foliage). Read-only at start-up.
r.Nanite.Foliage=True
; Large distances: keep the default 10 cm near plane; reverse-Z covers the rest.

[ConsoleVariables]
; The 100,000 lux sun puts exposure near EV 15. The default pre-exposure (4)
; covers about EV -8..12 and clips Lumen and sky-capture lighting; 8 covers
; EV -4..16, the full physically based range (PostProcessEyeAdaptation.cpp).
r.EyeAdaptation.CachedLightingPreExposure=8

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

; World Partition is decided per level: create the Aeon map as an Empty Level,
; not an Open World level, so the planet's own quadtree does the streaming.

[/Script/Engine.CollisionProfile]
; Terrain patches use the default WorldStatic profile.

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=01A094847DB77CC0888C8756F77926E7
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Lets unreal/tools/ue-remote.py drive the running editor from a shell
; (start Play, teleport, screenshots). Local host only.
bRemoteExecution=True
RemoteExecutionMulticastGroupEndpoint=239.0.0.1:6766
RemoteExecutionMulticastBindAddress=127.0.0.1
